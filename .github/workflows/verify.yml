name: Verify project

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install and test backend
        working-directory: backend
        run: npm ci && npm test

      - name: Download pinned Godot 4.7.1
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            --output /tmp/godot.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/godot.zip" | sha256sum --check
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Parse project and run logic contracts
        run: |
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          "$GODOT" --headless --editor --path . --quit
          "$GODOT" --headless --path . res://tests/logic_contracts.tscn
          "$GODOT" --headless --path . res://tests/ui_layout_qa.tscn
