<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Dala Dala Rush TZ | Moderation</title>
  <link rel="stylesheet" href="/admin.css">
  <script src="/admin.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Leaderboard moderation</h1>
        <p>Private operator console · scores remain unverified</p>
      </div>
      <button id="sign-out" class="quiet" type="button" hidden>Sign out</button>
    </header>

    <section id="auth-panel" aria-labelledby="auth-title">
      <h2 id="auth-title">Operator access</h2>
      <form id="auth-form">
        <label for="admin-token">Moderation token</label>
        <div class="auth-row">
          <input id="admin-token" type="password" autocomplete="current-password" required minlength="32">
          <button type="submit">Connect</button>
        </div>
      </form>
      <p id="auth-status" role="status" aria-live="polite"></p>
      <p class="muted">The token stays in this browser tab and is sent only to this HTTPS service.</p>
    </section>

    <section id="workspace" hidden>
      <nav aria-label="Moderation views">
        <button data-view="open" class="selected" type="button">Open reports</button>
        <button data-view="reviewed" type="button">Reviewed</button>
        <button data-view="hidden" type="button">Hidden profiles</button>
        <button id="refresh" class="quiet" type="button" aria-label="Refresh">Refresh</button>
      </nav>
      <p id="status" role="status" aria-live="polite"></p>
      <div class="table-wrap">
        <table>
          <thead id="table-head"></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
